<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Recognition — Absensi</title>
  <script src="/js/theme-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="container">
    <div class="page-head">
      <div>
        <h1>Absensi Face Recognition</h1>
        <div class="sub">Posisikan wajah Anda di depan kamera</div>
      </div>
      <a class="btn secondary" href="/scan.html">🔳 Pakai QR Code</a>
    </div>

    <div class="privacy-banner">
      🔒 Wajah diproses langsung di browser Anda. Yang dikirim ke server hanya vektor matematis (128 angka), bukan foto.
    </div>

    <div class="card center">
      <div class="camera-wrap">
        <video id="video" autoplay muted playsinline></video>
        <div class="camera-overlay"><div class="frame"></div></div>
        <div class="camera-placeholder" id="placeholder">Menyiapkan kamera...</div>
      </div>

      <div id="result" class="mt-2"></div>
      <div id="status" class="hint mt-2"></div>

      <div class="field-row mt-2" style="justify-content:center">
        <button id="scan-btn" class="lg" disabled>😊 Absen Sekarang</button>
        <button id="retry-btn" class="secondary hidden">🔄 Ulangi</button>
      </div>

      <div class="hint mt-2">
        Kamera/model gagal? Gunakan <a href="/scan.html">QR Code</a> sebagai alternatif.
      </div>
    </div>
  </main>
  <script type="module" src="/js/page-face.js"></script>
</body>
</html>
